plugins {
    // Новый loom для 1.21.11 (Mojang mappings). Имя плагина сменилось на fabric-loom-remap.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // Loom сам добавляет maven для Minecraft и библиотек.
    // Сюда — только сторонние моды, если понадобятся.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// метаданные для лаунчера Эта (версии MC, загрузчики, зависимости) — рядом с jar
tasks.register('modMeta', Copy) {
    from('mod.json')
    into(layout.buildDirectory.dir('libs'))
    rename { 'rurukasuka-mod.json' }
    inputs.property 'version', project.version
    expand 'version': project.version
}
tasks.named('build') { dependsOn 'modMeta' }

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
