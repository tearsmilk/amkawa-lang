name: Epsilon (macOS Intel .dmg)

# push only: for pull_request GitHub matches `paths` against the whole PR diff, which rebuilt every app
on:
  push:
    branches: ["**"]
    paths:
      - "epsilon/**"
      - ".github/workflows/epsilon-macos.yml"
    tags:
      - "epsilon-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: epsilon
    env:
      PYTHON_VERSION: "3.11.9"
    steps:
      - uses: actions/checkout@v4

      - name: Install python.org Python (universal2, runs on macOS 10.9+)
        run: |
          curl -fsSLo /tmp/python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv "$RUNNER_TEMP/venv"
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          $PYTHON -m pip install --upgrade pip
          $PYTHON -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Build app + dmg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/epsilon-v* ]]; then export APP_VERSION="${GITHUB_REF#refs/tags/epsilon-v}"; fi
          PATH="$(dirname "$PYTHON"):$PATH" packaging/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Epsilon-macOS-x64
          path: epsilon/dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/epsilon-v')
        uses: softprops/action-gh-release@v2
        with:
          files: epsilon/dist/*.dmg
