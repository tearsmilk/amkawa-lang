name: Amkawa Voice (macOS Intel .dmg)

on:
  push:
    paths:
      - "amkawa-voice/**"
      - ".github/workflows/amkawa-voice-macos.yml"
    tags:
      - "voice-v*"
  pull_request:
    paths:
      - "amkawa-voice/**"
      - ".github/workflows/amkawa-voice-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Intel (x86_64) runner; binaries are checked to need at most macOS 11 (Big Sur)
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: amkawa-voice
    env:
      PYTHON_VERSION: "3.11.9"
    steps:
      - uses: actions/checkout@v4

      - name: Install python.org Python (universal2, runs on macOS 10.9+)
        run: |
          curl -fsSLo /tmp/python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          $PY -m venv "$RUNNER_TEMP/venv"
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          $PYTHON -m pip install --upgrade pip
          $PYTHON -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Build app + dmg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/voice-v* ]]; then export APP_VERSION="${GITHUB_REF#refs/tags/voice-v}"; fi
          PATH="$(dirname "$PYTHON"):$PATH" packaging/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AmkawaVoice-macOS-x64
          path: amkawa-voice/dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/voice-v')
        uses: softprops/action-gh-release@v2
        with:
          files: amkawa-voice/dist/*.dmg
