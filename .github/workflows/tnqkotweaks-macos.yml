name: TnQkoTweaks (macOS Intel .dmg)

# push only: for pull_request GitHub matches `paths` against the whole PR diff, which rebuilt every app
on:
  push:
    branches: ["**"]
    paths:
      - "tnqkotweaks/**"
      - ".github/workflows/tnqkotweaks-macos.yml"
    tags:
      - "tnqkotweaks-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Опубликовать релиз tnqkotweaks-v<версия> (пусто — просто собрать)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: tnqkotweaks
    steps:
      - uses: actions/checkout@v4

      - name: Build app + self-test + dmg
        run: |
          swiftc --version
          if [[ "$GITHUB_REF" == refs/tags/tnqkotweaks-v* ]]; then export APP_VERSION="${GITHUB_REF#refs/tags/tnqkotweaks-v}"; fi
          if [[ -n "${{ inputs.release_version }}" ]]; then export APP_VERSION="${{ inputs.release_version }}"; fi
          packaging/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TnQkoTweaks-macOS-x64
          path: tnqkotweaks/dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/tnqkotweaks-v') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && format('tnqkotweaks-v{0}', inputs.release_version) || github.ref_name }}
          name: TnQkoTweaks ${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          files: tnqkotweaks/dist/*.dmg
